name: Prepare DIR HELPER 15.16
on:
  push:
    branches:
      - release/dir-helper-15.16-20261116
    paths:
      - .release/release-15.16.patch.b64
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore tested code and apply verified delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/masters-today-counter-20261114:refs/remotes/origin/feature/masters-today-counter-20261114
          for f in tg.js dashboard.js content.js; do
            git show "origin/feature/masters-today-counter-20261114:$f" > "$f"
          done
          test "$(git hash-object tg.js)" = "79c97089b1ef09c7986689c0f8d15070982da1ce"
          test "$(git hash-object dashboard.js)" = "cdf03b2fd8d5461a1d1182841abb2f1ff67209f3"
          test "$(git hash-object content.js)" = "d1fd1024614ea9270910948a072a18f138e033c5"
          base64 -d .release/release-15.16.patch.b64 | xz -dc > /tmp/dir-helper-15.16.patch
          git apply --unidiff-zero --check /tmp/dir-helper-15.16.patch
          git apply --unidiff-zero /tmp/dir-helper-15.16.patch
          test "$(git hash-object tg.js)" = "8dae9588a7052d99cb9dd35cc97475d4eca4468f"
          test "$(git hash-object dashboard.js)" = "7e484e69121e46e431fc9102c523f227a646c331"
          test "$(git hash-object content.js)" = "170e5bf1a27002328c1281e5fa15e58a7808848b"
          node --check tg.js
          node --check dashboard.js
          node --check content.js
      - name: Update version and changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('manifest.json')
          data = json.loads(p.read_text())
          assert data['version'] == '15.15', data['version']
          data['version'] = '15.16'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          p = pathlib.Path('changelog.js')
          s = p.read_text()
          marker = 'var DH_CHANGELOG = [\n'
          assert s.count(marker) == 1
          entry = "  { v: '15.16', d: '16.11.2026', items: ['Раздача: рядом с мастерами появился ориентировочный счётчик заявок за день с учётом заявок, созданных раньше, но закрытых сегодня. Добавлена диагностика подсчёта.', 'В отчёте «Сегодня» появилась карточка «Создано сегодня»: наши заявки (без отметки «П») и партнёрские (с отметкой «П»).', 'В карточке «Заявок закрыто» видно, сколько из них наши. На круговой диаграмме наши заявки выделены отдельным цветом.', 'В отчёте Telegram /сегодня также показываются созданные сегодня заявки с разбивкой на наши и партнёрские.'] },\n"
          p.write_text(s.replace(marker, marker + entry))
          PY
          test "$(node -p "require('./manifest.json').version")" = "15.16"
      - name: Commit clean release branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .release/release-15.16.patch.b64 .github/workflows/prepare-15-16.yml
          git add tg.js dashboard.js content.js manifest.json changelog.js
          git config user.name "dir-helper-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "DIR HELPER 15.16: today source breakdown and master counts"
          git push origin HEAD:release/dir-helper-15.16-20261116
