<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DIR HELPER</title>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="dhov-top"><span>DIR HELPER</span><button id="ovx" title="Закрыть" aria-label="Закрыть">✕</button></div>
<header class="dhb">
  <div class="dhb-tools">
    <button class=" dhb-main" title="Раздача и проведение заявки" aria-label="Раздача и проведение заявки" id="give"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c.6-2.8 2.6-4.2 5-4.2s4.4 1.4 5 4.2"/></svg><span class="dhb-l">Раздача</span></button>
    <button class="" title="Аналитика" aria-label="Аналитика" data-mode="an"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 13V9M8 13V5M12 13V2.5"/></svg><span class="dhb-l">Аналитика</span></button>
    <button class="" title="Зарплата директора" aria-label="Зарплата директора" data-mode="zp">₽<span class="dhb-l">Зарплата</span></button>
    <button class="" title="Реклама" aria-label="Реклама" data-mode="ad"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 1.8h5.4L12.5 5v9.2H4z"/><path d="M6 8.5h4.5M6 11h3"/></svg><span class="dhb-l">Реклама</span></button>
    <button class="" title="Рейтинг городов" aria-label="Рейтинг городов" data-mode="rt">TOP</button>
    <button id="bot" class="dhb-bot" title="Telegram-бот на этом компьютере: включить / выключить" aria-label="Telegram-бот"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="5" width="11" height="8" rx="2"/><path d="M8 2.5V5M6 9h.01M10 9h.01"/></svg><span class="dhb-l">Бот</span><i class="dhb-dot"></i></button>
    <span class="dhb-sep"></span>
    <button data-z="-" title="Уменьшить" aria-label="Уменьшить">−</button><span class="dhb-z" id="zv">70%</span><button data-z="+" title="Увеличить" aria-label="Увеличить">+</button>
    <button class="" title="Открыть CRM во вкладке" aria-label="Открыть CRM во вкладке" id="tab"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 2.5H2.5v9h9V9M8 2.5h3.5V6M11.5 2.5 6.5 7.5"/></svg></button>
    <button class="dhb-new" id="news" title="Что нового" aria-label="Что нового">?</button>
  </div>
</header>
<main><iframe id="crm" src="https://mnc-lead-centre.ru/admin/domain/customer-request/index"></iframe></main>
<script src="changelog.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
